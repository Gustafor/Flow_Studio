<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Flow Studio — Launch</title>
<link rel="stylesheet" href="base.css">
<style>
  .stage { width: 1600px; height: 620px; padding: 24px; }
  .app { width: 1552px; height: 572px; }
  .btn-primary { position: relative; }
  .btn-primary::after {
    content: '';
    position: absolute;
    inset: -7px;
    border: 1px solid rgba(62, 207, 142, 0.5);
    border-radius: 13px;
    box-shadow: 0 0 28px rgba(62, 207, 142, 0.35);
  }
  .rpc {
    position: absolute;
    top: 14px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--stroke-2);
    border-radius: 7px;
    background: rgba(10, 14, 20, 0.85);
    color: var(--text-3);
    font-size: 10.5px;
    letter-spacing: 0.01em;
  }
  .rpc code { color: #7db7ff; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
  .toast { bottom: 16px; right: 16px; }
</style>
</head>
<body>
<div class="stage">
  <div class="app">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="titlebar-title"><b>Hermes Desktop</b><span class="titlebar-sep">/</span><span>Flow Studio</span></div>
      <div class="titlebar-right"><span>desktop plugin</span><span class="kbd">⌘K</span></div>
    </div>

    <div class="head">
      <div class="head-row">
        <div class="select"><span>Маркетинговое исследование</span><span class="caret">▼</span></div>
        <div class="icon-btn">＋</div>
        <div class="name-input">Маркетинговое исследование</div>
        <div class="count">6 шагов</div>
        <div class="spacer"></div>
        <div class="lang"><i>EN</i><b>RU</b></div>
      </div>
      <div class="tabs">
        <div class="tab">Редактор</div>
        <div class="tab active">Граф</div>
        <div class="tab">JSON</div>
      </div>
    </div>

    <div class="launchbar">
      <div class="iter">Итерации: <span class="box">1</span></div>
      <div class="spacer"></div>
      <div class="btn">Скопировать бриф запуска</div>
      <div class="btn btn-primary"><span class="play">▶</span>Запустить агента</div>
    </div>

    <div class="graph-wrap">
      <div class="canvas" id="canvas">
        <div class="rpc">gateway RPC <code>prompt.submit</code> → активная сессия</div>
        <div class="toast"><span class="ok">✓</span><div>Бриф отправлен агенту<small>6 шагов · 1 итерация · DAG-уровни</small></div></div>
      </div>
    </div>
  </div>
</div>

<script src="graph.js"></script>
<script>
  const nodes = [
    { id: 's1', type: 'agent', name: 'Сбор данных', x: 28, y: 105 },
    { id: 's2', type: 'agent', name: 'Анализ и SWOT', x: 312, y: 105 },
    { id: 'g1', type: 'exclusive', name: 'Бюджет?', x: 596, y: 105 },
    { id: 's3a', type: 'agent', name: 'План запуска (полный)', x: 880, y: 28 },
    { id: 's3b', type: 'agent', name: 'План запуска (минимальный)', x: 880, y: 120 },
    { id: 's4', type: 'output', name: 'Отчёт', x: 880, y: 212 },
  ];
  const edges = [
    { from: 's1', to: 's2' },
    { from: 's2', to: 'g1' },
    { from: 'g1', to: 's3a', label: 'Бюджет есть' },
    { from: 'g1', to: 's3b', label: 'Ограничен' },
    { from: 'g1', to: 's4', label: 'по умолчанию' },
  ];
  const canvas = document.getElementById('canvas');
  const zoom = 1;
  const gw = 1108, gh = 302;
  const ox = (canvas.clientWidth - gw * zoom) / 2;
  const oy = (canvas.clientHeight - gh * zoom) / 2 + 6;
  renderGraph(canvas, nodes, edges, { zoom, ox, oy });
</script>
</body>
</html>
