<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Flow Studio — Graph</title>
<link rel="stylesheet" href="base.css">
<style>
  .stage { width: 1760px; height: 900px; padding: 24px; }
  .app { width: 1712px; height: 852px; }
</style>
</head>
<body>
<div class="stage">
  <div class="app">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="titlebar-title"><b>Hermes Desktop</b><span class="titlebar-sep">/</span><span>Flow Studio</span></div>
      <div class="titlebar-right"><span>desktop plugin</span><span class="kbd">⌘K</span></div>
    </div>

    <div class="head">
      <div class="head-row">
        <div class="select"><span>Пайплайн ревью кода</span><span class="caret">▼</span></div>
        <div class="icon-btn">＋</div>
        <div class="name-input">Пайплайн ревью кода</div>
        <div class="count">8 шагов</div>
        <div class="spacer"></div>
        <div class="lang"><i>EN</i><b>RU</b></div>
      </div>
      <div class="tabs">
        <div class="tab">Редактор</div>
        <div class="tab active">Граф</div>
        <div class="tab">JSON</div>
      </div>
    </div>

    <div class="launchbar">
      <div class="iter">Итерации: <span class="box">1</span></div>
      <div class="spacer"></div>
      <div class="btn">Скопировать бриф запуска</div>
      <div class="btn btn-primary"><span class="play">▶</span>Запустить агента</div>
    </div>

    <div class="graph-wrap">
      <div class="canvas" id="canvas">
        <div class="zoom"><b>⟲</b><span class="divider"></span><b>−</b><i>90%</i><b>＋</b><b>1</b></div>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:#4f9cff"></i>Агент</span>
        <span><i class="dot" style="background:#b18cff"></i>Шлюз «параллельный»</span>
        <span><i class="dot" style="background:#3ecf8e"></i>Вывод</span>
      </div>
    </div>
  </div>
</div>

<script src="graph.js"></script>
<script>
  const nodes = [
    { id: 's1', type: 'agent', name: 'Ввод: код для ревью', x: 28, y: 105 },
    { id: 'g1', type: 'parallel', name: 'Параллельный разбор', x: 312, y: 105 },
    { id: 's2', type: 'agent', name: 'Безопасность', x: 596, y: 28 },
    { id: 's3', type: 'agent', name: 'Архитектура и стиль', x: 596, y: 120 },
    { id: 's4', type: 'agent', name: 'Производительность', x: 596, y: 212 },
    { id: 'g2', type: 'parallel', name: 'Слияние', x: 880, y: 105 },
    { id: 's5', type: 'agent', name: 'Финальное решение', x: 1164, y: 105 },
    { id: 's6', type: 'output', name: 'Вердикт ревью', x: 1448, y: 105 },
  ];
  const edges = [
    { from: 's1', to: 'g1' },
    { from: 'g1', to: 's2' }, { from: 'g1', to: 's3' }, { from: 'g1', to: 's4' },
    { from: 's2', to: 'g2' }, { from: 's3', to: 'g2' }, { from: 's4', to: 'g2' },
    { from: 'g2', to: 's5' },
    { from: 's5', to: 's6' },
  ];
  const canvas = document.getElementById('canvas');
  const zoom = 0.9;
  const gw = 1676, gh = 302;
  const ox = (canvas.clientWidth - gw * zoom) / 2;
  const oy = (canvas.clientHeight - gh * zoom) / 2;
  renderGraph(canvas, nodes, edges, { zoom, ox, oy });
</script>
</body>
</html>
